name: Build WSL2 Kernel with SquashFS Zstd

on:
  workflow_dispatch:  # 手动触发
  schedule:
    - cron: '0 0 * * 1'  # 每周一自动检查

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install build-essential flex bison dwarves libssl-dev libelf-dev cpio qemu-utils rsync squashfs-tools

      - name: Configure kernel
        run: |
          cp Microsoft/config-wsl .config
          # SquashFS + Zstd
          ./scripts/config --enable CONFIG_SQUASHFS
          ./scripts/config --enable CONFIG_SQUASHFS_ZSTD
          ./scripts/config --enable CONFIG_SQUASHFS_4K_DEVBLK_SIZE
          ./scripts/config --enable CONFIG_SQUASHFS_ZLIB
          ./scripts/config --enable CONFIG_SQUASHFS_LZ4
          ./scripts/config --enable CONFIG_SQUASHFS_LZO
          ./scripts/config --enable CONFIG_SQUASHFS_XZ
          ./scripts/config --enable CONFIG_SQUASHFS_XATTR
          ./scripts/config --enable CONFIG_SQUASHFS_FILE_DIRECT
          
          # 并行解压（微软内核命名）
          ./scripts/config --disable CONFIG_SQUASHFS_COMPILE_DECOMP_SINGLE
          ./scripts/config --disable CONFIG_SQUASHFS_CHOICE_DECOMP_BY_MOUNT
          # ./scripts/config --enable CONFIG_SQUASHFS_COMPILE_DECOMP_MULTI
          ./scripts/config --enable CONFIG_SQUASHFS_COMPILE_DECOMP_MULTI_PERCPU
          ./scripts/config --enable CONFIG_SQUASHFS_COMP_CACHE_FULL
          
          # 内核压缩改 Zstd
          ./scripts/config --enable CONFIG_KERNEL_ZSTD
          ./scripts/config --disable CONFIG_KERNEL_GZIP
          
          # NTFS3 内置
          ./scripts/config --enable CONFIG_NTFS3_FS
          ./scripts/config --enable CONFIG_NTFS3_LZX_XPRESS
          ./scripts/config --enable CONFIG_NTFS3_FS_POSIX_ACL
          
          # Android Binder
          ./scripts/config --enable CONFIG_ANDROID_BINDER_IPC
          ./scripts/config --enable CONFIG_ANDROID_BINDERFS
          
          # DMA-BUF Heaps
          ./scripts/config --enable CONFIG_DMABUF_HEAPS
          ./scripts/config --enable CONFIG_DMABUF_HEAPS_SYSTEM
          
          make olddefconfig

      - name: Build kernel and modules
        env:
          LOCALVERSION: ""
        run: |
          make -j$(nproc)
          make -j$(nproc) modules
          mkdir -p modules headers perf
          make INSTALL_MOD_PATH="$PWD/modules" modules_install
          make -C tools/perf NO_JEVENTS=1 NO_JVMTI=1 NO_LIBTRACEEVENT=1 install DESTDIR="$PWD/perf" prefix=/

      - name: Generate modules.vhdx (flat)
        env:
          LOCALVERSION: ""
        run: |
          release=$(make -s kernelrelease)
          tmp_dir=$(mktemp -d)
          
          # 平铺 modules
          staging_dir="$tmp_dir/staging"
          mkdir -p "$staging_dir"
          cp -r "$PWD/modules/lib/modules/$release/." "$staging_dir/"
          rm -f "$staging_dir/build" "$staging_dir/source"
          
          staging_size=$(du -bs "$staging_dir" | awk '{print $1;}')
          image_size=$((staging_size + (256 * (1 << 20))))
          image_blocks=$((image_size / 1024))
          inode_count=$(find "$staging_dir" | wc -l)
          inode_count=$((inode_count + 4096))
          
          mke2fs -q -L '' -d "$staging_dir" -N "$inode_count" -b 1024 -t ext4 "$tmp_dir/modules.img" "$image_blocks"
          qemu-img convert -O vhdx "$tmp_dir/modules.img" "$PWD/modules.vhdx"
          
          rm -rf "$tmp_dir"
          cd "$PWD/perf"
          mksquashfs . "../perf-$release.squashfs" -comp zstd -b 1M -Xcompression-level 22

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wsl2-kernel-full
          path: |
            arch/x86/boot/bzImage
            modules.vhdx
            perf-*.squashfs

      - name: Show artifact sizes
        run: ls -lh arch/x86/boot/bzImage modules.vhdx perf-*.squashfs
